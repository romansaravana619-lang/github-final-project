<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeCraftHub - Personalized Learning Dashboard</title>
<style>
:root{--bg:#f6f7fb;--surface:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:24px 32px;background:var(--surface);border-bottom:1px solid var(--border)}
.eyebrow{margin:0 0 4px;color:var(--muted);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.container{max-width:1100px;margin:auto;padding:28px 24px 48px}.hero,.toolbar,.card,.empty{background:var(--surface);border:1px solid var(--border);border-radius:16px}
.hero{display:flex;justify-content:space-between;align-items:center;padding:24px;margin-bottom:18px}.hero p{color:var(--muted)}
.toolbar{display:flex;gap:12px;padding:16px;margin-bottom:22px}.toolbar input{flex:1}.toolbar input,.toolbar select,.dialog input,.dialog textarea,.dialog select{padding:11px 12px;border:1px solid var(--border);border-radius:10px;font:inherit;background:#fff}
.toolbar select{max-width:190px}.course-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{padding:18px}.card-top,.card-actions,.dialog-actions{display:flex;align-items:center;gap:8px}.card-top{justify-content:space-between}
.badge{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#f3f4f6}.course-description,.course-meta{color:var(--muted);line-height:1.5}.card-actions{margin-top:18px}
.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700;font:inherit}
.btn-primary{background:linear-gradient(135deg,#5b5ff5,#7c3aed);color:#ffffff;box-shadow:0 8px 18px rgba(91,95,245,.28)}
.btn-success{background:linear-gradient(135deg,#0f9f6e,#16a34a);color:#ffffff;box-shadow:0 8px 18px rgba(22,163,74,.24)}
.btn-danger{background:#dc2626;color:#fff}.btn-secondary{background:#eef0f3;color:#374151}
dialog{width:min(600px,calc(100vw - 30px));border:0;border-radius:16px;padding:0;box-shadow:0 20px 70px rgba(0,0,0,.2)}dialog::backdrop{background:rgba(15,23,42,.45)}
.dialog{padding:22px}.dialog-heading{display:flex;justify-content:space-between;align-items:center}.dialog label{display:block;margin:14px 0;font-weight:700}
.dialog label input,.dialog label textarea,.dialog label select{display:block;width:100%;margin-top:7px;font-weight:400}.two-column{display:grid;grid-template-columns:1fr 1fr;gap:14px}.dialog-actions{justify-content:flex-end;margin-top:18px}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:700px){.topbar,.hero,.toolbar{flex-direction:column;align-items:stretch}.toolbar select{max-width:none}.two-column{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"><div><p class="eyebrow">Personalized learning platform</p><h1>CodeCraftHub</h1></div><button class="btn btn-primary" id="addCourseBtn" type="button">+ Add Course</button></header>
<main class="container">
<section class="hero"><div><h2>Learning Dashboard</h2><p>Create, update, explore, and manage developer-focused courses.</p></div><div><strong id="courseCount">0 courses</strong></div></section>
<section class="toolbar"><input id="searchInput" type="search" placeholder="Search courses..." aria-label="Search courses"><select id="levelFilter" aria-label="Filter by level"><option value="">All levels</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></section>
<section id="courseGrid" class="course-grid" aria-live="polite"></section>
</main>
<dialog id="courseDialog"><div class="dialog"><div class="dialog-heading"><h2 id="dialogTitle">Add Course</h2><button class="btn btn-secondary" type="button" id="closeDialogBtn">×</button></div>
<input type="hidden" id="courseId">
<label>Course title<input id="titleInput" maxlength="80" required></label>
<label>Description<textarea id="descriptionInput" rows="4" maxlength="300" required></textarea></label>
<div class="two-column"><label>Category<input id="categoryInput" maxlength="40" required></label><label>Level<select id="levelInput"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label></div>
<label>Duration<input id="durationInput" placeholder="e.g. 6 weeks" required></label>
<div class="dialog-actions"><button class="btn btn-secondary" type="button" id="cancelBtn">Cancel</button><button class="btn btn-success" type="button" id="saveCourseBtn">Save Course</button></div>
</div></dialog>
<script>
const STORAGE_KEY="codecrafthub-courses";
let courses=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
const $=id=>document.getElementById(id);
function escapeHtml(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(courses))}
function render(){
 const q=$("searchInput").value.trim().toLowerCase(), level=$("levelFilter").value;
 const visible=courses.filter(c=>(!q||(c.title+" "+c.description+" "+c.category).toLowerCase().includes(q))&&(!level||c.level===level));
 $("courseCount").textContent=courses.length+" course"+(courses.length===1?"":"s");
 if(!visible.length){$("courseGrid").innerHTML='<div class="empty">No courses match the current filters.</div>';return;}
 $("courseGrid").innerHTML=visible.map(function(c){return '<article class="card"><div class="card-top"><span class="badge">'+escapeHtml(c.category)+'</span><span class="badge">'+escapeHtml(c.level)+'</span></div><h3>'+escapeHtml(c.title)+'</h3><p class="course-description">'+escapeHtml(c.description)+'</p><div class="course-meta">'+escapeHtml(c.duration)+'</div><div class="card-actions"><button class="btn btn-primary" data-action="edit" data-id="'+c.id+'">Edit</button><button class="btn btn-danger delete-btn" type="button" aria-label="Delete course" data-action="delete" data-id="'+c.id+'">Delete</button></div></article>'}).join("");
}
function openAdd(){$("dialogTitle").textContent="Add Course";$("courseId").value="";$("titleInput").value="";$("descriptionInput").value="";$("categoryInput").value="";$("levelInput").value="Beginner";$("durationInput").value="";$("courseDialog").showModal()}
function openEdit(c){$("dialogTitle").textContent="Edit Course";$("courseId").value=c.id;$("titleInput").value=c.title;$("descriptionInput").value=c.description;$("categoryInput").value=c.category;$("levelInput").value=c.level;$("durationInput").value=c.duration;$("courseDialog").showModal()}
function saveCourse(){
 const p={id:$("courseId").value||crypto.randomUUID(),title:$("titleInput").value.trim(),description:$("descriptionInput").value.trim(),category:$("categoryInput").value.trim(),level:$("levelInput").value,duration:$("durationInput").value.trim()};
 if(!p.title||!p.description||!p.category||!p.duration){alert("Please complete all course fields.");return}
 const i=courses.findIndex(c=>c.id===p.id); if(i<0)courses.unshift(p);else courses[i]=p; persist();render();$("courseDialog").close();
}
function deleteCourse(id){const c=courses.find(x=>x.id===id);if(!c)return;if(!confirm("Delete \""+c.title+"\"?"))return;courses=courses.filter(x=>x.id!==id);persist();render()}
function handleDelete(id){deleteCourse(id)}
$("addCourseBtn").onclick=openAdd;$("closeDialogBtn").onclick=()=>$("courseDialog").close();$("cancelBtn").onclick=()=>$("courseDialog").close();$("saveCourseBtn").onclick=saveCourse;$("searchInput").oninput=render;$("levelFilter").onchange=render;
$("courseGrid").onclick=function(e){const b=e.target.closest("button");if(!b)return;const c=courses.find(x=>x.id===b.dataset.id);if(!c)return;if(b.dataset.action==="edit")openEdit(c)}
render();
</script>
</body></html>
