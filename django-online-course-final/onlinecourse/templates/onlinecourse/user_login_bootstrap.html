<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Login</h2>
    {% if message %}<div class="alert alert-danger">{{ message }}</div>{% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="form-group"><label>Username</label><input class="form-control" name="username"></div>
        <div class="form-group"><label>Password</label><input class="form-control" type="password" name="psw"></div>
        <button class="btn btn-primary" type="submit">Login</button>
    </form>
</div>
</body>
</html>
