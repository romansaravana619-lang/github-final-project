<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Create account</h2>
    {% if message %}<div class="alert alert-danger">{{ message }}</div>{% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="form-group"><label>Username</label><input class="form-control" name="username" required></div>
        <div class="form-group"><label>First name</label><input class="form-control" name="firstname"></div>
        <div class="form-group"><label>Last name</label><input class="form-control" name="lastname"></div>
        <div class="form-group"><label>Password</label><input class="form-control" type="password" name="psw" required></div>
        <button class="btn btn-success" type="submit">Sign Up</button>
    </form>
</div>
</body>
</html>
